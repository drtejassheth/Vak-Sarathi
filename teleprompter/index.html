   Settings sheet
   ========================================================= */
const SET_UI=[
  ['Scrolling'],
  ['speed','Speed','range',0.5,40,0.5],
  ['countdown','Countdown before start','range',0,10,1,' s'],
  ['autoPause','Stop at [PAUSE] cues','toggle'],
  ['loop','Loop when finished','toggle'],
  ['tapToPause','Tap text to play / pause','toggle'],
  ['Text'],
  ['fontSize','Text size','range',16,220,1,' px'],
  ['lineHeight','Line spacing','range',1,2.5,0.05],
  ['width','Text width','range',40,100,1,'%'],
  ['font','Font','select',{sans:'Sans serif',serif:'Serif',rounded:'Rounded',mono:'Monospace',condensed:'Condensed',heavy:'Heavy'}],
  ['align','Alignment','select',{left:'Left',center:'Centre',right:'Right',justify:'Justify'}],
  ['bold','Bold text','toggle'],
  ['uppercase','ALL CAPS','toggle'],
  ['rtl','Right-to-left script','toggle'],
  ['Colours'],
  ['theme','Theme','themes'],
  ['textColor','Text colour','color'],
  ['bgColor','Background colour','color'],
  ['cueColor','Notes & cues colour','color'],
  ['Reading guide'],
  ['showMarker','Show reading line','toggle'],
  ['eyeLine','Reading line position','range',10,80,1,'%'],
  ['focusDim','Dim text away from the line','range',0,0.9,0.05],
  ['Mirror (beam-splitter rigs)'],
  ['mirrorH','Flip horizontally','toggle'],
  ['mirrorV','Flip vertically','toggle'],
  ['Camera'],
  ['camFacing','Camera','select',{user:'Front (selfie)',environment:'Back'}],
  ['camMirror','Mirror front-camera preview','toggle'],
  ['camDim','Darken camera behind text','range',0,0.95,0.05],
  ['Voice scrolling'],
  ['voiceEngine','Voice engine','select',{auto:'Automatic',offline:'Built-in offline (English, silent)',system:'Phone speech service'}],
  ['voiceLang','Speech language','select',LANGS],
  ['voiceOffline','Offline voice engine','offline'],
  ['Display'],
  ['showTimer','Show timer & pace','toggle'],
  ['showProgress','Show progress bar','toggle'],
  ['readingWpm','Reading pace for estimates','range',80,220,5,' wpm'],
  ['About'],
  ['appVersion','Vāk Sārathī','version'],
];
const META={};
const NO_LAYOUT=new Set(['speed','countdown','autoPause','loop','tapToPause','voiceLang','voiceEngine','readingWpm','camFacing']);
function buildSettings(){
  let h='';
  for(const row of SET_UI){
    if(row.length===1){h+=`<h4>${row[0]}</h4>`;continue}
    const[k,label,type,a,b,step,unit='']=row;META[k]={type,unit};
    if(type==='range')h+=`<label class="set-row col"><span class="lbl">${label}<output data-out="${k}"></output></span><input type="range" data-k="${k}" min="${a}" max="${b}" step="${step}"></label>`;
    else if(type==='toggle')h+=`<label class="set-row"><span class="lbl">${label}</span><input type="checkbox" class="switch" data-k="${k}"></label>`;
    else if(type==='select')h+=`<label class="set-row"><span class="lbl">${label}</span><select data-k="${k}">${Object.entries(a).map(([v,t])=>`<option value="${v}">${esc(t)}</option>`).join('')}</select></label>`;
    else if(type==='color')h+=`<label class="set-row"><span class="lbl">${label}</span><input type="color" data-k="${k}"></label>`;
    else if(type==='version')h+=`<div class="set-row"><span class="lbl" style="flex-direction:column;gap:2px">${label}<small id="verStatus" style="color:var(--ui-muted);font-size:13px"></small></span><button class="btn small" id="updCheck" hidden>Check for updates</button></div>`;
    else if(type==='offline')h+=`<div class="set-row"><span class="lbl" style="flex-direction:column;gap:2px">${label}<small id="voStatus" style="color:var(--ui-muted);font-size:13px"></small></span><button class="btn small" id="voSave">Save</button></div>`;
    else if(type==='themes')h+=`<div class="set-row themes">${Object.entries(THEMES).map(([id,t])=>`<button class="swatch" data-theme="${id}" style="color:${t.fg};background:${t.bg}">Aa<small>${t.name}</small></button>`).join('')}</div>`;
  }
  h+=`<div class="set-actions"><button class="btn small" id="setHelp">Shortcuts & formatting</button><button class="btn small danger" id="setReset">Reset settings</button></div>`;
  const box=$('#setBody');box.innerHTML=h;
  box.addEventListener('input',onSetInput);box.addEventListener('change',onSetInput);
  box.addEventListener('click',e=>{
    const sw=e.target.closest('[data-theme]');
    if(sw){const t=THEMES[sw.dataset.theme];Object.assign(S,{theme:sw.dataset.theme,textColor:t.fg,bgColor:t.bg,cueColor:t.cue});saveSettings();applyStyles();syncSettingsUI();return}
    if(e.target.id==='setHelp')showHelp();
    if(e.target.id==='voSave')saveVoiceOffline(true);
    if(e.target.id==='updCheck'){closeSettings();checkForUpdate(true)}
    if(e.target.id==='setReset'&&confirm('Reset all prompter settings to defaults?')){S=Object.assign({},DEFAULTS);saveSettings();applyStyles();syncSettingsUI();toast('Settings reset')}
  });
  syncSettingsUI();
}
function onSetInput(e){
  const el=e.target,k=el.dataset&&el.dataset.k;if(!k)return;
  const m=META[k];const v=m.type==='range'?parseFloat(el.value):m.type==='toggle'?el.checked:el.value;
  if(S[k]===v)return;S[k]=v;
  if(k==='textColor'||k==='bgColor'||k==='cueColor')S.theme='custom';
  saveSettings();
  if(k==='camFacing'){if(recorder){toast('Stop recording first')}else if(camStream){stopCamera();startCamera()}}
  if((k==='voiceLang'||k==='voiceEngine')&&P.voice&&P.playing)startRecognition();
  if(NO_LAYOUT.has(k))updateHud();else applyStyles();
  syncSettingsUI();
}
function syncSettingsUI(){
  $$('#setBody [data-k]').forEach(el=>{const k=el.dataset.k;if(el.type==='checkbox')el.checked=!!S[k];else if(document.activeElement!==el||el.type==='range')el.value=S[k]});
  $$('#setBody output').forEach(o=>{const k=o.dataset.out;o.textContent=fmtNum(S[k])+(META[k].unit||'')});
  $$('#setBody .swatch').forEach(b=>b.classList.toggle('sel',b.dataset.theme===S.theme));
}
function openSettings(){P.sheetOpen=true;syncSettingsUI();updateVoUI();updateVersionUI();$('#settings').classList.add('open');$('#btnSettings').classList.add('on');showHud()}
function closeSettings(){P.sheetOpen=false;$('#settings').classList.remove('open');$('#btnSettings').classList.remove('on');scheduleHudHide()}

/* =========================================================
   Auto-updater (Android app): checks the public GitHub releases
   ========================================================= */
const UPDATE_REPO='drtejassheth/vak-sarathi';
const IS_ANDROID_APP=NATIVE&&window.Capacitor&&Capacitor.getPlatform&&Capacitor.getPlatform()==='android';
let updBusy=false,appInfo=null;
function verCmp(a,b){const x=String(a).replace(/^v/,'').split('.').map(n=>parseInt(n)||0),y=String(b).replace(/^v/,'').split('.').map(n=>parseInt(n)||0);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0?1:-1}return 0}
async function getAppInfo(){if(appInfo)return appInfo;if(IS_ANDROID_APP&&NP.AppUpdater){try{appInfo=await NP.AppUpdater.getInfo()}catch(e){}}return appInfo}
async function checkForUpdate(manual){
  if(!IS_ANDROID_APP||!NP.AppUpdater){if(manual)toast(NATIVE?'On iPhone/iPad, updates are installed from your Mac':'The web app updates itself when you reopen it online');return}
  if(updBusy)return;
  if(!manual&&Date.now()-LS.get('tp.updCheckT',0)<6*3600e3)return;
  if(!navigator.onLine){if(manual)toast('Connect to the internet to check for updates');return}
  updBusy=true;
  try{
    if(manual)toast('Checking for updates…');
    const r=await fetch(`https://api.github.com/repos/${UPDATE_REPO}/releases/latest`,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
    if(!r.ok)throw new Error('GitHub replied '+r.status);
    const rel=await r.json();LS.set('tp.updCheckT',Date.now());
    const asset=(rel.assets||[]).find(a=>/\.apk$/i.test(a.name));
    const info=await getAppInfo();const latest=String(rel.tag_name||'').replace(/^v/,'');
    if(!asset||!info||verCmp(latest,info.versionName)<=0){if(manual)toast(`You have the latest version (${info?info.versionName:'?'})`);return}
    if(!manual&&LS.get('tp.updLater','')===rel.tag_name+'|'+new Date().toDateString())return;
    const notes=String(rel.body||'').replace(/\*\*|`|#+ /g,'').trim().slice(0,700);
    const box=document.createElement('div');
    box.innerHTML=`<p style="margin:0 0 10px"><b>${esc(rel.name||'Version '+latest)}</b> is available. You have ${esc(info.versionName)}.</p><p style="margin:0;white-space:pre-line;color:var(--ui-muted);font-size:14px">${esc(notes)}</p><p style="margin:12px 0 0;font-size:13px;color:var(--ui-muted)">Your scripts and settings are kept. Download: ${(asset.size/1048576).toFixed(0)} MB.</p>`;
    openModal({title:'Update available',body:box,actions:[
      {label:'Later',onClick:()=>LS.set('tp.updLater',rel.tag_name+'|'+new Date().toDateString())},
      {label:'Update now',primary:true,onClick:()=>installUpdate(asset)}]});
  }catch(e){if(manual)toast('Could not check for updates: '+e.message,{ms:4000})}
  finally{updBusy=false}
}
async function installUpdate(asset){
  const U=NP.AppUpdater;
  try{
    const c=await U.canInstall();
    if(!c.allowed){
      openModal({title:'One-time permission',body:'<p style="margin:0">Android needs permission for Vāk Sārathī to install its own updates. On the next screen, turn on <b>Allow from this source</b>, come back, and tap <b>Update now</b> again.</p>',
        actions:[{label:'Cancel'},{label:'Open settings',primary:true,onClick:()=>U.openInstallSettings()}]});
      return;
    }
    const sub=await U.addListener('progress',p=>{if(p.total>0)toast(`Downloading update… ${Math.round(p.loaded/p.total*100)}%`,{ms:4000})});
    toast('Downloading update…',{ms:4000});
    try{await U.downloadAndInstall({url:asset.browser_download_url})}finally{sub.remove()}
    toast('Tap Install (or Update) to finish',{ms:5000});
  }catch(e){toast('Update failed: '+(e&&e.message||e),{ms:5000})}
}
function autoCheckUpdate(){if(IS_ANDROID_APP&&view==='library')checkForUpdate(false)}
window.addEventListener('hashchange',()=>setTimeout(autoCheckUpdate,1500));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(autoCheckUpdate,1500)});
async function updateVersionUI(){
  const el=$('#verStatus'),b=$('#updCheck');if(!el)return;
  const info=await getAppInfo();
  el.textContent=info?'Version '+info.versionName:NATIVE?'iPhone/iPad app':'Web app';
  if(b)b.hidden=!IS_ANDROID_APP;
}

   Boot
   ========================================================= */

if(!NATIVE&&'serviceWorker' in navigator&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname)))navigator.serviceWorker.register('sw.js').catch(()=>{});
route();
autoSaveVoice();
setTimeout(autoCheckUpdate,4000);
</script>
